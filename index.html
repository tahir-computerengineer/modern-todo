<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Yöneticisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="header">
                <h2>Görev Yöneticisi</h2>
                <button id="darkModeToggle" title="Karanlık Mod">🌙</button>
            </div>

            <div class="auth-container">
                <div id="userProfile" class="user-profile-box">
                    <img id="userAvatar" src="" alt="Avatar">
                    <span id="userName"></span>
                </div>
                <button id="loginBtn">Google ile Giriş Yap</button>
                <button id="logoutBtn" title="Çıkış Yap"></button>
            </div>

            <div class="view-tabs">
                <button id="viewActiveBtn" class="active-tab">Aktif Görevler</button>
                <button id="viewCompletedBtn">Tamamlananlar</button>
            </div>

            <div class="tools-container">
                <input type="text" id="searchInput" placeholder="Görevlerde ara...">
                <select id="filterCategory">
                    <option value="Tümü">Tüm Kategoriler</option>
                    <option value="İş">İş</option>
                    <option value="Kişisel">Kişisel</option>
                    <option value="Eğitim">Eğitim</option>
                </select>
            </div>

            <div class="input-container">
                <textarea id="todoInput" placeholder="Görev detaylarını buraya yazın..." rows="3"></textarea>
                
                <div class="options-grid">
                    <div class="option-item">
                        <label for="todoCategory">Kategori</label>
                        <select id="todoCategory">
                            <option value="İş">İş</option>
                            <option value="Kişisel">Kişisel</option>
                            <option value="Eğitim">Eğitim</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label for="todoPriority">Öncelik</label>
                        <select id="todoPriority">
                            <option value="Düşük">Düşük</option>
                            <option value="Orta" selected>Orta</option>
                            <option value="Yüksek">Yüksek</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label for="todoDate">Termin</label>
                        <input type="date" id="todoDate">
                    </div>
                    <div class="option-item">
                        <label for="todoRecurrence">Periyot (Tekrar)</label>
                        <select id="todoRecurrence">
                            <option value="none">Tek Seferlik</option>
                            <option value="daily">Her Gün</option>
                            <option value="weekly">Her Hafta</option>
                            <option value="monthly">Her Ay</option>
                        </select>
                    </div>
                    <div class="option-item full-width">
                        <label for="todoImage">Görsel</label>
                        <input type="file" id="todoImage" accept="image/*">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button id="addBtn">Görevi Ekle</button>
                    <button id="cancelBtn">Vazgeç</button>
                </div>
            </div>

            <button id="exportBtn" class="export-btn">Excel (CSV) Olarak İndir</button>
        </aside>

        <main class="main-content">
            <ul id="todoList">
            </ul>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
